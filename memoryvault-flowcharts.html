<title>MemoryVault Flowcharts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout concept: three engineering figures on one page. Teal marks MemoryVault
     components, red dashes mark the path that exists without them. */
  :root {
    --bg: #edf0f3; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #101b26; --muted: #55677a; --line: #d3dae1;
    --vault: #0b6e8a; --vault-soft: #dceef3; --danger: #b8322a; --danger-soft: #f8e3e0;
    --warn: #8f5a08; --warn-soft: #f6ead3; --ok: #1c744a; --ok-soft: #ddf0e5;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --font-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e151c; --surface: #16202a; --surface-2: #1b2733; --ink: #e6edf3; --muted: #8fa1b2; --line: #263543;
      --vault: #4db6d4; --vault-soft: #123240; --danger: #f0766c; --danger-soft: #3a1c1a;
      --warn: #e0a44c; --warn-soft: #3a2b12; --ok: #55c58a; --ok-soft: #14301f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e151c; --surface: #16202a; --surface-2: #1b2733; --ink: #e6edf3; --muted: #8fa1b2; --line: #263543;
    --vault: #4db6d4; --vault-soft: #123240; --danger: #f0766c; --danger-soft: #3a1c1a;
    --warn: #e0a44c; --warn-soft: #3a2b12; --ok: #55c58a; --ok-soft: #14301f; color-scheme: dark;
  }

  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 28px 64px; }
  .wrap { max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 36px; }
  h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(2rem, 1.2rem + 3.2vw, 3.4rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  h2 { font-size: clamp(1.25rem, 1.05rem + 0.9vw, 1.7rem); font-weight: 600; }
  p { margin: 0; }
  .lede { max-width: 62ch; color: var(--muted); margin-top: 10px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--muted); margin-top: 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend svg { width: 34px; height: 12px; }

  figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .fig-head { display: flex; flex-direction: column; gap: 4px; }
  .fig-head .kicker { font: 600 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--vault); }
  .scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px; }
  .scroll svg { display: block; width: 100%; min-width: 900px; height: auto; color: var(--ink); }
  figcaption { color: var(--muted); max-width: 78ch; font-size: 14px; }
  figcaption b { color: var(--ink); font-weight: 600; }

  /* diagram vocabulary */
  .node  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
  .gate  { fill: var(--vault-soft); stroke: var(--vault); stroke-width: 2; }
  .store { fill: var(--surface-2); stroke: var(--ink); stroke-width: 1.4; }
  .ok    { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.6; }
  .hold  { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.6; }
  .stop  { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 1.6; }
  .scope { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
  .edge  { fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .edge.bad { stroke: var(--danger); stroke-dasharray: 6 5; }
  .edge.blocked { stroke: var(--danger); stroke-dasharray: 3 4; }
  .mk { fill: var(--ink); }
  .mk-bad { fill: var(--danger); }
  .tt { font: 600 14px var(--font-display); fill: var(--ink); }
  .ts { font: 400 11px var(--font-mono); fill: var(--muted); }
  .te { font: 500 11.5px var(--font-body); fill: var(--muted); }
  .te.bad { fill: var(--danger); font-weight: 600; }
  .te.vault { fill: var(--vault); font-weight: 600; }
  .xmark { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 1.6; }
  .xglyph { stroke: var(--danger); stroke-width: 2; }
  .scope-label { font: 600 11px var(--font-mono); fill: var(--muted); letter-spacing: 0.04em; }
</style>

<div class="wrap">
  <header>
    <h1>MemoryVault, drawn</h1>
    <p class="lede">Three figures: where the two checks sit between a document and an outgoing message, how one memory write is decided, and what changes when two people share a vault.</p>
    <div class="legend" aria-label="Legend">
      <span><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" class="edge"/></svg>normal path</span>
      <span><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" class="edge bad"/></svg>path that exists without MemoryVault</span>
      <span><svg viewBox="0 0 34 12" aria-hidden="true"><rect x="1" y="1" width="32" height="10" rx="2" class="gate"/></svg>MemoryVault component</span>
      <span><svg viewBox="0 0 34 12" aria-hidden="true"><rect x="1" y="1" width="32" height="10" rx="2" class="hold"/></svg>held</span>
      <span><svg viewBox="0 0 34 12" aria-hidden="true"><rect x="1" y="1" width="32" height="10" rx="2" class="stop"/></svg>blocked</span>
    </div>
  </header>

  <!-- FIGURE 1 -->
  <figure>
    <div class="fig-head">
      <span class="kicker">Figure 1 · end to end</span>
      <h2>A document in session 1 reaches the Outbox in session 2</h2>
    </div>
    <div class="scroll">
      <svg viewBox="0 0 1140 480" role="img" aria-label="Two gates stand on the path from a poisoned document to an outgoing message: a write gate before the memory store, and a tool gate before the outbox. A recall log records which chat used each memory. Without the gates, red dashed paths carry the poison straight through.">
        <defs>
          <marker id="f1a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="mk"/></marker>
          <marker id="f1b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="mk-bad"/></marker>
        </defs>

        <!-- Session labels -->
        <text x="30" y="70" class="ts">SESSION 1 · reads the document</text>
        <text x="130" y="296" class="ts">SESSION 2 · new chat, document gone</text>

        <!-- Row 1 -->
        <rect x="30" y="90" width="170" height="60" rx="3" class="node"/>
        <text x="115" y="116" text-anchor="middle" class="tt">1  Poisoned document</text>
        <text x="115" y="134" text-anchor="middle" class="ts">hidden footer text</text>

        <rect x="250" y="90" width="170" height="60" rx="3" class="node"/>
        <text x="335" y="116" text-anchor="middle" class="tt">2  Agent reads it</text>
        <text x="335" y="134" text-anchor="middle" class="ts">proposes a memory write</text>

        <rect x="490" y="84" width="170" height="72" rx="3" class="gate"/>
        <text x="575" y="112" text-anchor="middle" class="tt">3  Write gate</text>
        <text x="575" y="132" text-anchor="middle" class="ts">provenance + safety</text>

        <line x1="200" y1="120" x2="250" y2="120" class="edge" marker-end="url(#f1a)"/>
        <line x1="420" y1="120" x2="490" y2="120" class="edge" marker-end="url(#f1a)"/>
        <text x="455" y="112" text-anchor="middle" class="te">save?</text>

        <!-- Memory store with two compartments -->
        <rect x="880" y="40" width="200" height="210" rx="3" class="store"/>
        <text x="980" y="60" text-anchor="middle" class="tt">4  Memory store</text>
        <rect x="895" y="72" width="170" height="64" rx="3" class="hold"/>
        <text x="980" y="98" text-anchor="middle" class="tt">Quarantined</text>
        <text x="980" y="116" text-anchor="middle" class="ts">withheld from the model</text>
        <rect x="895" y="160" width="170" height="64" rx="3" class="ok"/>
        <text x="980" y="186" text-anchor="middle" class="tt">Authoritative</text>
        <text x="980" y="204" text-anchor="middle" class="ts">user said or confirmed</text>

        <line x1="660" y1="102" x2="895" y2="102" class="edge" marker-end="url(#f1a)"/>
        <text x="690" y="94" class="te">came from a document</text>
        <polyline points="660,140 720,140 720,192 895,192" class="edge" marker-end="url(#f1a)"/>
        <text x="732" y="184" class="te">the user said it</text>

        <!-- Ledger -->
        <rect x="520" y="200" width="170" height="52" rx="3" class="gate"/>
        <text x="605" y="224" text-anchor="middle" class="tt">Provenance ledger</text>
        <text x="605" y="241" text-anchor="middle" class="ts">logs reads + user text</text>
        <line x1="580" y1="200" x2="580" y2="158" class="edge" marker-end="url(#f1a)"/>
        <text x="590" y="182" class="te">what was read</text>

        <!-- Bypass 1 -->
        <path d="M335 90 V14 H1110 V192 H1067" class="edge bad" marker-end="url(#f1b)"/>
        <text x="720" y="32" text-anchor="middle" class="te bad">without MemoryVault: saved straight in as a user preference</text>

        <!-- Row 2 (reads right to left) -->
        <line x1="980" y1="224" x2="980" y2="310" class="edge" marker-end="url(#f1a)"/>
        <text x="990" y="272" class="te">next chat: recall</text>

        <rect x="880" y="310" width="190" height="60" rx="3" class="node"/>
        <text x="975" y="336" text-anchor="middle" class="tt">5  Session starts clean</text>
        <text x="975" y="354" text-anchor="middle" class="ts">injects authoritative only</text>

        <rect x="640" y="310" width="170" height="60" rx="3" class="node"/>
        <text x="725" y="336" text-anchor="middle" class="tt">6  Agent drafts report</text>
        <text x="725" y="354" text-anchor="middle" class="ts">calls send_report</text>
        <line x1="880" y1="340" x2="810" y2="340" class="edge" marker-end="url(#f1a)"/>

        <rect x="400" y="304" width="170" height="72" rx="3" class="gate"/>
        <text x="485" y="332" text-anchor="middle" class="tt">7  Tool gate</text>
        <text x="485" y="352" text-anchor="middle" class="ts">recipient allowlist</text>
        <line x1="640" y1="340" x2="570" y2="340" class="edge" marker-end="url(#f1a)"/>
        <text x="605" y="330" text-anchor="middle" class="te">recipients</text>

        <rect x="130" y="310" width="170" height="60" rx="3" class="node"/>
        <text x="215" y="336" text-anchor="middle" class="tt">8  Outbox</text>
        <text x="215" y="354" text-anchor="middle" class="ts">what was actually sent</text>
        <line x1="400" y1="340" x2="300" y2="340" class="edge" marker-end="url(#f1a)"/>
        <text x="350" y="330" text-anchor="middle" class="te">allowed</text>

        <rect x="300" y="200" width="170" height="52" rx="3" class="stop"/>
        <text x="385" y="224" text-anchor="middle" class="tt">Blocked and logged</text>
        <text x="385" y="241" text-anchor="middle" class="ts">not in the allowlist</text>
        <line x1="440" y1="304" x2="440" y2="252" class="edge" marker-end="url(#f1a)"/>
        <text x="450" y="284" class="te">external address</text>

        <!-- Recall log -->
        <line x1="975" y1="370" x2="975" y2="404" class="edge" marker-end="url(#f1a)"/>
        <text x="985" y="392" class="te">logs each recall</text>
        <rect x="880" y="404" width="190" height="56" rx="3" class="gate"/>
        <text x="975" y="430" text-anchor="middle" class="tt">9  Recall log</text>
        <text x="975" y="448" text-anchor="middle" class="ts">which chat used what</text>

        <!-- Bypass 2 -->
        <path d="M725 370 V436 H215 V372" class="edge bad" marker-end="url(#f1b)"/>
        <text x="470" y="428" text-anchor="middle" class="te bad">without MemoryVault: also sent to the external address</text>
      </svg>
    </div>
    <figcaption><b>Two independent gates.</b> The write gate (3) decides whether a proposed memory becomes a standing preference. The tool gate (7) checks every recipient against a list the model cannot edit, so a poisoned memory that slipped past (3) still cannot move data. The red dashed paths are the two edges that exist when neither gate is there. The recall log (9) records every session that was handed a memory, and every withheld one, so a bad memory can be traced to each chat and action it touched.</figcaption>
  </figure>

  <!-- FIGURE 2 -->
  <figure>
    <div class="fig-head">
      <span class="kicker">Figure 2 · the write gate</span>
      <h2>How one memory write is decided</h2>
    </div>
    <div class="scroll">
      <svg viewBox="0 0 1140 540" role="img" aria-label="Decision flow for a memory write: accepted only if the user wrote it, it is not derived from lower-trust memory, and the content check says safe. Everything else is quarantined, and a user approval re-runs the content check, which can still keep it quarantined.">
        <defs>
          <marker id="f2a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="mk"/></marker>
        </defs>

        <rect x="20" y="100" width="140" height="60" rx="3" class="node"/>
        <text x="90" y="126" text-anchor="middle" class="tt">Agent proposes</text>
        <text x="90" y="144" text-anchor="middle" class="ts">a memory write</text>

        <polygon points="240,130 340,78 440,130 340,182" class="gate"/>
        <text x="340" y="126" text-anchor="middle" class="tt">In the user's</text>
        <text x="340" y="143" text-anchor="middle" class="tt">latest message?</text>

        <polygon points="500,130 600,78 700,130 600,182" class="gate"/>
        <text x="600" y="126" text-anchor="middle" class="tt">Built from a</text>
        <text x="600" y="143" text-anchor="middle" class="tt">lower-trust memory?</text>

        <polygon points="760,130 860,78 960,130 860,182" class="gate"/>
        <text x="860" y="126" text-anchor="middle" class="tt">Content check</text>
        <text x="860" y="143" text-anchor="middle" class="tt">says it is safe?</text>

        <rect x="995" y="100" width="125" height="60" rx="3" class="ok"/>
        <text x="1057" y="126" text-anchor="middle" class="tt">Accepted</text>
        <text x="1057" y="144" text-anchor="middle" class="ts">authoritative</text>

        <line x1="160" y1="130" x2="240" y2="130" class="edge" marker-end="url(#f2a)"/>
        <line x1="440" y1="130" x2="500" y2="130" class="edge" marker-end="url(#f2a)"/>
        <text x="470" y="120" text-anchor="middle" class="te">yes</text>
        <line x1="700" y1="130" x2="760" y2="130" class="edge" marker-end="url(#f2a)"/>
        <text x="730" y="120" text-anchor="middle" class="te">no</text>
        <line x1="960" y1="130" x2="995" y2="130" class="edge" marker-end="url(#f2a)"/>
        <text x="978" y="120" text-anchor="middle" class="te">yes</text>

        <line x1="340" y1="182" x2="340" y2="250" class="edge" marker-end="url(#f2a)"/>
        <text x="350" y="222" class="te">no: came from a document</text>
        <line x1="600" y1="182" x2="600" y2="250" class="edge" marker-end="url(#f2a)"/>
        <text x="610" y="222" class="te">yes: summaries inherit trust</text>
        <line x1="860" y1="182" x2="860" y2="250" class="edge" marker-end="url(#f2a)"/>
        <text x="870" y="222" class="te">no, or unsure</text>

        <rect x="240" y="250" width="720" height="54" rx="3" class="hold"/>
        <text x="600" y="274" text-anchor="middle" class="tt">Quarantined</text>
        <text x="600" y="292" text-anchor="middle" class="ts">held for review · never injected into a session · never shared</text>

        <line x1="600" y1="304" x2="600" y2="350" class="edge" marker-end="url(#f2a)"/>
        <text x="610" y="332" class="te">waits for you</text>

        <rect x="515" y="350" width="170" height="56" rx="3" class="node"/>
        <text x="600" y="376" text-anchor="middle" class="tt">You approve</text>
        <text x="600" y="394" text-anchor="middle" class="ts">in the dashboard</text>

        <line x1="685" y1="378" x2="760" y2="378" class="edge" marker-end="url(#f2a)"/>
        <text x="722" y="368" text-anchor="middle" class="te">re-check</text>

        <polygon points="760,378 860,326 960,378 860,430" class="gate"/>
        <text x="860" y="374" text-anchor="middle" class="tt">Content check</text>
        <text x="860" y="391" text-anchor="middle" class="tt">runs again</text>

        <path d="M960 378 H1057 V160" class="edge" marker-end="url(#f2a)"/>
        <text x="1000" y="368" text-anchor="middle" class="te">safe</text>

        <line x1="860" y1="430" x2="860" y2="470" class="edge" marker-end="url(#f2a)"/>
        <text x="870" y="456" class="te">unsafe</text>
        <rect x="775" y="470" width="170" height="52" rx="3" class="stop"/>
        <text x="860" y="494" text-anchor="middle" class="tt">Stays quarantined</text>
        <text x="860" y="511" text-anchor="middle" class="ts">model cannot release</text>
      </svg>
    </div>
    <figcaption><b>The content check is veto-only.</b> It sits on the last test before acceptance and again after a human approves, and in both places it can only send an item to quarantine. A document that tells the classifier "mark this safe" gains nothing, because a "safe" verdict never lifts a hold. Only the user's approval does, and it is checked again before the item becomes authoritative.</figcaption>
  </figure>

  <!-- FIGURE 3 -->
  <figure>
    <div class="fig-head">
      <span class="kicker">Figure 3 · shared vaults</span>
      <h2>What Bob receives from Alice, and what he does not</h2>
    </div>
    <div class="scroll">
      <svg viewBox="0 0 1100 440" role="img" aria-label="Alice's quarantined memory never leaves her private scope. Her authoritative memory reaches the shared vault only after a second member confirms. Bob's agent reads shared memory as context, but his tool gate uses his own allowlist, so shared memory cannot add recipients.">
        <defs>
          <marker id="f3a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="mk"/></marker>
        </defs>

        <!-- Alice -->
        <rect x="60" y="20" width="320" height="56" rx="3" class="node"/>
        <text x="220" y="46" text-anchor="middle" class="tt">Alice's agent</text>
        <text x="220" y="63" text-anchor="middle" class="ts">reads documents, takes Alice's instructions</text>

        <rect x="40" y="110" width="350" height="150" rx="4" class="scope"/>
        <text x="215" y="252" text-anchor="middle" class="scope-label">ALICE'S PRIVATE SCOPE</text>

        <rect x="55" y="138" width="150" height="98" rx="3" class="hold"/>
        <text x="130" y="162" text-anchor="middle" class="tt">Quarantined</text>
        <text x="130" y="182" text-anchor="middle" class="ts">report_recipients</text>
        <text x="130" y="197" text-anchor="middle" class="ts">= external address</text>
        <text x="130" y="219" text-anchor="middle" class="ts">stays in this scope</text>

        <rect x="225" y="138" width="150" height="98" rx="3" class="ok"/>
        <text x="300" y="162" text-anchor="middle" class="tt">Authoritative</text>
        <text x="300" y="182" text-anchor="middle" class="ts">summary_style</text>
        <text x="300" y="197" text-anchor="middle" class="ts">= bullets</text>
        <text x="300" y="219" text-anchor="middle" class="ts">Alice said it</text>

        <line x1="130" y1="76" x2="130" y2="138" class="edge" marker-end="url(#f3a)"/>
        <text x="140" y="104" class="te">from a document</text>
        <line x1="300" y1="76" x2="300" y2="138" class="edge" marker-end="url(#f3a)"/>
        <text x="310" y="104" class="te">Alice said it</text>

        <!-- Promotion -->
        <line x1="375" y1="188" x2="410" y2="188" class="edge" marker-end="url(#f3a)"/>
        <rect x="410" y="164" width="130" height="48" rx="3" class="gate"/>
        <text x="475" y="184" text-anchor="middle" class="tt">second member</text>
        <text x="475" y="201" text-anchor="middle" class="tt">must confirm</text>
        <line x1="540" y1="188" x2="580" y2="188" class="edge" marker-end="url(#f3a)"/>

        <!-- Shared vault -->
        <rect x="580" y="120" width="150" height="136" rx="3" class="store"/>
        <text x="655" y="146" text-anchor="middle" class="tt">Shared vault</text>
        <text x="655" y="170" text-anchor="middle" class="ts">authoritative only</text>
        <text x="655" y="186" text-anchor="middle" class="ts">author and confirmer</text>
        <text x="655" y="202" text-anchor="middle" class="ts">attached to each item</text>

        <!-- Bob -->
        <rect x="810" y="150" width="250" height="56" rx="3" class="node"/>
        <text x="935" y="176" text-anchor="middle" class="tt">Bob's agent</text>
        <text x="935" y="193" text-anchor="middle" class="ts">reads shared memory as context</text>
        <line x1="730" y1="178" x2="810" y2="178" class="edge" marker-end="url(#f3a)"/>
        <text x="770" y="168" text-anchor="middle" class="te">context only</text>

        <line x1="935" y1="206" x2="935" y2="250" class="edge" marker-end="url(#f3a)"/>
        <text x="945" y="234" class="te">send_report</text>

        <rect x="810" y="250" width="250" height="72" rx="3" class="gate"/>
        <text x="935" y="278" text-anchor="middle" class="tt">Bob's tool gate</text>
        <text x="935" y="299" text-anchor="middle" class="ts">Bob's own allowlist: bob@company</text>

        <line x1="935" y1="322" x2="935" y2="372" class="edge" marker-end="url(#f3a)"/>
